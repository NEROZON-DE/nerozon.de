<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>NEROZON</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #040810;
      overflow: hidden;
    }

    .logo {
      width: min(68vw, 760px);
      max-height: 72vh;
      display: block;
    }

    @media (max-width: 640px) {
      .logo {
        width: min(84vw, 520px);
      }
    }
  </style>
</head>
<body>
  <img class="logo" src="nerozon-logo.png" alt="NEROZON">
</body>
</html>
