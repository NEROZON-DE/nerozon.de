<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#040810">
  <title>NEROZON</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, #0b1520 0, #050a12 42%, #020407 78%),
        #040810;
      perspective: 1200px;
    }

    .showcase {
      width: clamp(180px, 38vmin, 360px);
      aspect-ratio: 6 / 7;
      position: relative;
      transform-style: preserve-3d;
      animation: showcase-turn 13s infinite;
      animation-delay: 2.5s;
      will-change: transform;
    }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 17.15%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .front {
      transform: translateZ(8px);
      filter: drop-shadow(0 26px 42px rgb(0 0 0 / 0.46));
    }

    .front img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .back {
      display: grid;
      place-items: center;
      transform: rotateY(180deg) translateZ(8px);
      background:
        linear-gradient(112deg, transparent 20%, rgb(255 255 255 / 0.14) 38%, transparent 53%),
        linear-gradient(145deg, #080b0f 0%, #3e4650 24%, #11161c 50%, #59616a 73%, #090c10 100%);
      border: 1px solid rgb(255 255 255 / 0.2);
      box-shadow:
        inset 0 0 0 1px rgb(0 0 0 / 0.65),
        inset 18px 0 30px rgb(255 255 255 / 0.04),
        inset -20px 0 34px rgb(0 0 0 / 0.42),
        0 26px 42px rgb(0 0 0 / 0.46);
    }

    .back::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        98deg,
        rgb(255 255 255 / 0.022) 0,
        rgb(255 255 255 / 0.022) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
    }

    .back span {
      position: relative;
      color: #23cbe2;
      font-size: clamp(1.65rem, 6.2vmin, 3.65rem);
      font-weight: 650;
      letter-spacing: 0.19em;
      line-height: 1;
      text-indent: 0.19em;
      text-shadow:
        0 0 18px rgb(35 203 226 / 0.22),
        0 1px 0 rgb(255 255 255 / 0.16),
        0 -1px 0 rgb(0 0 0 / 0.8);
    }

    @keyframes showcase-turn {
      0% {
        transform: rotateY(0deg);
        animation-timing-function: cubic-bezier(0.55, 0.06, 0.68, 0.45);
      }

      15.3846% {
        transform: rotateY(180deg);
        animation-timing-function: linear;
      }

      23.0769% {
        transform: rotateY(180deg);
        animation-timing-function: cubic-bezier(0.32, 0.55, 0.45, 0.94);
      }

      38.4615%,
      100% {
        transform: rotateY(360deg);
      }
    }

    @media (max-width: 640px) {
      .showcase {
        width: min(58vmin, 78vw);
      }
    }
  </style>
</head>
<body>
  <main class="showcase" aria-label="NEROZON Showcase">
    <div class="face front">
      <img src="/assets/brand/nerozon-mark.svg" alt="NEROZON">
    </div>
    <div class="face back"><span>TRUST</span></div>
  </main>
</body>
</html>
