name: Deploy FACTORY DEV1

on:
  push:
    branches:
      - dev1
    paths:
      - 'factory/**'
      - 'deploy/**'
      - '.github/workflows/deploy-factory.yml'
  workflow_dispatch:

concurrency:
  group: nerozon-factory-dev1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment controller
        run: |
          mkdir -p controller
          cp -R deploy/. controller/
          find controller -type d -exec chmod 755 {} \;
          find controller -type f -exec chmod 644 {} \;

      - name: Deploy controller
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV1 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV1 }}
          local_path: './controller/*'
          remote_path: '/deploy/'
          sftp_only: true

      - name: Deploy controller .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV1 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV1 }}
          local_path: './controller/.htaccess'
          remote_path: '/deploy/'
          sftp_only: true

      - name: Create FACTORY deployment token
        id: token
        run: |
          TOKEN="dpl-$(date +%s%3N)-$(openssl rand -hex 16)"
          mkdir -p trigger-factory
          touch "trigger-factory/${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Upload FACTORY deployment token
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV1 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV1 }}
          local_path: './trigger-factory/*'
          remote_path: '/'
          sftp_only: true

      - name: Prepare FACTORY staging
        run: curl --fail --silent --show-error --max-time 30 --request POST "https://deploy-dev1.nerozon.de/index.php?action=prepare&component=factory&token=${{ steps.token.outputs.token }}"

      - name: Prepare FACTORY package
        run: |
          mkdir -p package-factory
          cp -R factory/. package-factory/
          printf '%s\n' "$GITHUB_SHA" > package-factory/.revision
          find package-factory -type f \( -name 'RULES.md' -o -name '*-RULES.md' -o -name 'SPECS.md' -o -name '*-SPECS.md' \) -delete
          find package-factory -type d -exec chmod 755 {} \;
          find package-factory -type f -exec chmod 644 {} \;

      - name: Upload FACTORY staging
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV1 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV1 }}
          local_path: './package-factory/*'
          remote_path: '/factory-deploy/'
          sftp_only: true

      - name: Upload FACTORY protected dotfiles
        run: |
          mkdir -p package-factory-dotfiles
          cp package-factory/.htaccess package-factory-dotfiles/.htaccess
          cp package-factory/.revision package-factory-dotfiles/.revision

      - name: Upload FACTORY .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV1 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV1 }}
          local_path: './package-factory-dotfiles/.htaccess'
          remote_path: '/factory-deploy/'
          sftp_only: true

      - name: Upload FACTORY revision
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV1 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV1 }}
          local_path: './package-factory-dotfiles/.revision'
          remote_path: '/factory-deploy/'
          sftp_only: true

      - name: Activate and verify FACTORY
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          EXPECTED_ENV: DEV1
          FACTORY_HOST: factory-dev1.nerozon.de
          DEPLOY_HOST: deploy-dev1.nerozon.de
        run: |
          set -euo pipefail
          rollback() {
            curl --silent --show-error --max-time 30 --request POST "https://${DEPLOY_HOST}/index.php?action=rollback&component=factory&token=${TOKEN}" || true
          }
          trap rollback ERR
          curl --fail --silent --show-error --max-time 30 --request POST "https://${DEPLOY_HOST}/index.php?action=deploy&component=factory&token=${TOKEN}"
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "https://${FACTORY_HOST}/health")"
          STATUS="$(printf '%s' "$HEALTH" | jq -r '.status')"
          ENVIRONMENT="$(printf '%s' "$HEALTH" | jq -r '.environment')"
          REVISION="$(printf '%s' "$HEALTH" | jq -r '.revision')"
          test "$STATUS" = "ok"
          test "$ENVIRONMENT" = "$EXPECTED_ENV"
          test "$REVISION" = "$GITHUB_SHA"
          HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "http://${FACTORY_HOST}/health")"
          case "$HTTP_CODE" in 301|302|307|308|403) ;; *) exit 1 ;; esac
          for path in src/bootstrap.php .revision .htaccess; do
            CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "https://${FACTORY_HOST}/${path}")"
            case "$CODE" in 403|404) ;; *) exit 1 ;; esac
          done
          curl --fail --silent --show-error --max-time 30 --request POST "https://${DEPLOY_HOST}/index.php?action=confirm&component=factory&token=${TOKEN}"
          trap - ERR
          {
            echo "### FACTORY deployment evidence"
            echo "- environment: ${EXPECTED_ENV}"
            echo "- revision: ${GITHUB_SHA}"
            echo "- activation: successful"
            echo "- HTTPS health: successful"
            echo "- plain HTTP: ${HTTP_CODE} (non-serving)"
            echo "- internal paths: not exposed"
            echo "- final outcome: successful"
          } >> "$GITHUB_STEP_SUMMARY"
