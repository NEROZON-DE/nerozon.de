name: Deploy FACTORY PREP

on:
  push:
    branches: [pre-prod]
    paths: ['factory/**','deploy/**','.github/workflows/deploy-factory.yml']
  workflow_dispatch:
concurrency: {group: nerozon-factory-prep, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare controller
        run: |
          mkdir -p controller; cp -R deploy/. controller/; find controller -type d -exec chmod 755 {} \;; find controller -type f -exec chmod 644 {} \;
      - name: Deploy controller
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with: {username: '${{ secrets.IONOS_SFTP_USER_PREP }}', server: '${{ secrets.IONOS_SFTP_HOST }}', password: '${{ secrets.IONOS_SFTP_PASSWORD_PREP }}', local_path: './controller/*', remote_path: '/deploy/', sftp_only: true}
      - name: Create token
        id: token
        run: |
          TOKEN="dpl-$(date +%s%3N)-$(openssl rand -hex 16)"; mkdir -p trigger-factory; touch "trigger-factory/${TOKEN}"; echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Upload token
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with: {username: '${{ secrets.IONOS_SFTP_USER_PREP }}', server: '${{ secrets.IONOS_SFTP_HOST }}', password: '${{ secrets.IONOS_SFTP_PASSWORD_PREP }}', local_path: './trigger-factory/*', remote_path: '/', sftp_only: true}
      - name: Prepare staging
        run: curl --fail --silent --show-error --max-time 30 --request POST "https://deploy-prep.nerozon.de/index.php?action=prepare&component=factory&token=${{ steps.token.outputs.token }}"
      - name: Prepare package
        run: |
          mkdir -p package-factory; cp -R factory/. package-factory/; printf '%s\n' "$GITHUB_SHA" > package-factory/.revision
          find package-factory -type f \( -name 'RULES.md' -o -name '*-RULES.md' -o -name 'SPECS.md' -o -name '*-SPECS.md' \) -delete
          find package-factory -type d -exec chmod 755 {} \;; find package-factory -type f -exec chmod 644 {} \;
      - name: Upload staging
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with: {username: '${{ secrets.IONOS_SFTP_USER_PREP }}', server: '${{ secrets.IONOS_SFTP_HOST }}', password: '${{ secrets.IONOS_SFTP_PASSWORD_PREP }}', local_path: './package-factory/*', remote_path: '/factory-deploy/', sftp_only: true}
      - name: Upload .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with: {username: '${{ secrets.IONOS_SFTP_USER_PREP }}', server: '${{ secrets.IONOS_SFTP_HOST }}', password: '${{ secrets.IONOS_SFTP_PASSWORD_PREP }}', local_path: './package-factory/.htaccess', remote_path: '/factory-deploy/', sftp_only: true}
      - name: Upload revision
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with: {username: '${{ secrets.IONOS_SFTP_USER_PREP }}', server: '${{ secrets.IONOS_SFTP_HOST }}', password: '${{ secrets.IONOS_SFTP_PASSWORD_PREP }}', local_path: './package-factory/.revision', remote_path: '/factory-deploy/', sftp_only: true}
      - name: Activate and verify
        env: {TOKEN: '${{ steps.token.outputs.token }}', EXPECTED_ENV: PREP, FACTORY_HOST: factory-prep.nerozon.de, DEPLOY_HOST: deploy-prep.nerozon.de}
        run: |
          set -euo pipefail
          rollback(){ curl --silent --show-error --max-time 30 --request POST "https://${DEPLOY_HOST}/index.php?action=rollback&component=factory&token=${TOKEN}" || true; }
          trap rollback ERR
          curl --fail --silent --show-error --max-time 30 --request POST "https://${DEPLOY_HOST}/index.php?action=deploy&component=factory&token=${TOKEN}"
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "https://${FACTORY_HOST}/health")"
          test "$(printf '%s' "$HEALTH"|jq -r '.status')" = ok; test "$(printf '%s' "$HEALTH"|jq -r '.environment')" = "$EXPECTED_ENV"; test "$(printf '%s' "$HEALTH"|jq -r '.revision')" = "$GITHUB_SHA"
          HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "http://${FACTORY_HOST}/health")"; case "$HTTP_CODE" in 301|302|307|308|403) ;; *) exit 1;; esac
          for path in src/bootstrap.php .revision .htaccess; do CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "https://${FACTORY_HOST}/${path}")"; case "$CODE" in 403|404) ;; *) exit 1;; esac; done
          curl --fail --silent --show-error --max-time 30 --request POST "https://${DEPLOY_HOST}/index.php?action=confirm&component=factory&token=${TOKEN}"; trap - ERR
          printf '### FACTORY deployment evidence\n- environment: %s\n- revision: %s\n- activation: successful\n- HTTPS health: successful\n- plain HTTP: %s (non-serving)\n- internal paths: not exposed\n- final outcome: successful\n' "$EXPECTED_ENV" "$GITHUB_SHA" "$HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
