name: Work Orders DEV1

on:
  push:
    branches:
      - dev1
    paths:
      - 'workorders/request/**'
      - '.github/workflows/workorders-dev1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workorders-dev1
  cancel-in-progress: false

env:
  DISPATCHER_URL: https://dispatcher-dev2.nerozon.de/workorder.php

jobs:
  queue-workorders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DEV1
        uses: actions/checkout@v4
        with:
          ref: dev1
          fetch-depth: 2

      - name: Find new Work Orders
        id: workorders
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/workorders.txt

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            find workorders/request -maxdepth 1 -type f -name 'WO-*.md' -print 2>/dev/null | sort > /tmp/workorders.txt || true
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              find workorders/request -maxdepth 1 -type f -name 'WO-*.md' -print 2>/dev/null | sort > /tmp/workorders.txt || true
            else
              git diff --diff-filter=AM --name-only "$BEFORE" "$AFTER" -- 'workorders/request/*.md' > /tmp/workorders.txt
              if git diff --name-only "$BEFORE" "$AFTER" -- '.github/workflows/workorders-dev1.yml' | grep -q .; then
                find workorders/request -maxdepth 1 -type f -name 'WO-*.md' -print 2>/dev/null | sort > /tmp/workorders.txt || true
              fi
            fi
          fi

          cat /tmp/workorders.txt
          if [[ -s /tmp/workorders.txt ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register, queue and start Work Orders
        if: steps.workorders.outputs.found == 'true'
        shell: bash
        env:
          WORKER_TRIGGER_TOKEN: ${{ secrets.DISPATCHER_WORKER_TRIGGER_TOKEN_DEV2 }}
        run: |
          set -euo pipefail

          if [[ -z "${WORKER_TRIGGER_TOKEN:-}" ]]; then
            echo "Missing GitHub secret DISPATCHER_WORKER_TRIGGER_TOKEN_DEV2" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r FILE; do
            [[ -n "$FILE" ]] || continue
            [[ -f "$FILE" ]] || continue

            WO=$(awk -F': *' '$1 == "wo" {print $2; exit}' "$FILE" | tr -d '\r')
            TARGET=$(awk -F': *' '$1 == "target" {print toupper($2); exit}' "$FILE" | tr -d '\r')

            if [[ -z "$WO" || -z "$TARGET" ]]; then
              echo "Invalid Work Order metadata in $FILE" >&2
              exit 1
            fi

            case "$TARGET" in
              ENGINEERING) AUTH_REPO="NEROZON-DE/authority-engineering" ;;
              SOLUTION) AUTH_REPO="NEROZON-DE/authority-solution" ;;
              IMPLEMENTATION) AUTH_REPO="NEROZON-DE/authority-implementation" ;;
              QA|QUALITY-ASSURANCE|QUALITY_ASSURANCE)
                TARGET="QUALITY-ASSURANCE"
                AUTH_REPO="NEROZON-DE/authority-quality-assurance"
                ;;
              *)
                echo "Unsupported target '$TARGET' in $FILE" >&2
                exit 1
                ;;
            esac

            REQUEST_COMMIT=$(git rev-parse HEAD)

            REGISTER_JSON=$(jq -n \
              --arg wo_id "$WO" \
              --arg target "$TARGET" \
              --arg repository "${{ github.repository }}" \
              --arg branch "dev1" \
              --arg path "$FILE" \
              --arg commit "$REQUEST_COMMIT" \
              --arg authority_repository "$AUTH_REPO" \
              --arg authority_branch "main" \
              --arg authority_path "ROLE.md" \
              '{wo_id:$wo_id,target:$target,repository:$repository,branch:$branch,path:$path,commit:$commit,authority_repository:$authority_repository,authority_branch:$authority_branch,authority_path:$authority_path}')

            curl --fail --silent --show-error --max-time 30 \
              --request POST \
              --header "Authorization: Bearer ${WORKER_TRIGGER_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$REGISTER_JSON" \
              "${DISPATCHER_URL}?action=register"
            echo

            QUEUED="workorders/queued/$(basename "$FILE")"
            mkdir -p workorders/queued
            git mv "$FILE" "$QUEUED"
            git add "$QUEUED"
            git commit -m "Queue ${WO}"
            git push origin HEAD:dev1

            QUEUED_COMMIT=$(git rev-parse HEAD)
            START_JSON=$(jq -n \
              --arg wo_id "$WO" \
              --arg target "$TARGET" \
              --arg repository "${{ github.repository }}" \
              --arg branch "dev1" \
              --arg path "$QUEUED" \
              --arg commit "$QUEUED_COMMIT" \
              --arg authority_repository "$AUTH_REPO" \
              --arg authority_branch "main" \
              --arg authority_path "ROLE.md" \
              '{wo_id:$wo_id,target:$target,repository:$repository,branch:$branch,path:$path,commit:$commit,authority_repository:$authority_repository,authority_branch:$authority_branch,authority_path:$authority_path}')

            curl --fail --silent --show-error --max-time 45 \
              --request POST \
              --header "Authorization: Bearer ${WORKER_TRIGGER_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$START_JSON" \
              "${DISPATCHER_URL}?action=start"
            echo
          done < /tmp/workorders.txt
