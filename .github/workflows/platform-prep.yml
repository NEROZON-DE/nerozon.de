name: Deploy Platform PREP

# CR-02 boundary verification after PREP application deployment.

on:
  push:
    branches:
      - pre-prod
    paths:
      - 'dispatcher/**'
      - 'github.nerozon.de/**'
      - '.github/workflows/platform-prep.yml'
  workflow_dispatch:

concurrency:
  group: nerozon-platform-prep
  cancel-in-progress: false

jobs:
  deploy-platform-prep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PREP
        uses: actions/checkout@v4

      - name: Prepare GitHub adapter package
        run: |
          set -euo pipefail
          mkdir -p package-github
          cp -R github.nerozon.de/. package-github/
          find package-github -type f \( -name 'RULES.md' -o -name '*-RULES.md' -o -name 'SPEC.md' -o -name '*-SPEC.md' \) -delete
          find package-github -type d -exec chmod 755 {} \;
          find package-github -type f -exec chmod 644 {} \;

      - name: Deploy GitHub adapter to PREP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_PREP }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_PREP }}
          local_path: './package-github/*'
          remote_path: '/github/'
          sftp_only: true

      - name: Deploy GitHub adapter .htaccess to PREP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_PREP }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_PREP }}
          local_path: './package-github/.htaccess'
          remote_path: '/github/'
          sftp_only: true

      - name: Smoke test GitHub adapter
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 6 --retry-all-errors --retry-delay 3 \
            'https://github-prep.nerozon.de/'

      - name: Prepare Dispatcher package
        run: |
          set -euo pipefail
          mkdir -p package-dispatcher
          cp -R dispatcher/. package-dispatcher/
          find package-dispatcher -type f \( -name 'RULES.md' -o -name '*-RULES.md' -o -name 'SPEC.md' -o -name '*-SPEC.md' \) -delete
          find package-dispatcher -type d -exec chmod 755 {} \;
          find package-dispatcher -type f -exec chmod 644 {} \;

      - name: Deploy Dispatcher to PREP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_PREP }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_PREP }}
          local_path: './package-dispatcher/*'
          remote_path: '/dispatcher/'
          sftp_only: true

      - name: Deploy Dispatcher .htaccess to PREP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_PREP }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_PREP }}
          local_path: './package-dispatcher/.htaccess'
          remote_path: '/dispatcher/'
          sftp_only: true

      - name: Smoke test Dispatcher
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 6 --retry-all-errors --retry-delay 3 \
            'https://dispatcher-prep.nerozon.de/status.php'

      - name: Verify PREP HTTP and env-config boundary
        shell: bash
        run: |
          set -euo pipefail

          check_http_boundary() {
            local host="$1"
            local path="$2"
            local headers
            local status
            local location
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 15 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "http://${host}${path}")"
            case "$status" in
              301|302|307|308)
                location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {sub(/\r$/, "", $2); print $2; exit}' "$headers")"
                case "$location" in
                  https://"$host"/*|https://"$host") ;;
                  *) echo "HTTP boundary invalid redirect for $host: $status" >&2; exit 1 ;;
                esac
                ;;
              400|401|403|404|405|410|421|426)
                ;;
              *) echo "HTTP operational content not rejected/redirected for $host: $status" >&2; exit 1 ;;
            esac
            rm -f "$headers"
            echo "$host HTTP boundary: $status"
          }

          check_config_boundary() {
            local host="$1"
            local status
            status="$(curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              "https://${host}/env-config/")"
            case "$status" in
              200|206) echo "env-config structurally reachable on $host" >&2; exit 1 ;;
              *) echo "$host env-config boundary: $status" ;;
            esac
          }

          check_http_boundary prep.nerozon.de /
          check_http_boundary api-prep.nerozon.de /
          check_http_boundary deploy-prep.nerozon.de /
          check_http_boundary dispatcher-prep.nerozon.de /status.php
          check_http_boundary factory-prep.nerozon.de /
          check_http_boundary github-prep.nerozon.de /

          check_config_boundary prep.nerozon.de
          check_config_boundary api-prep.nerozon.de
          check_config_boundary deploy-prep.nerozon.de
          check_config_boundary dispatcher-prep.nerozon.de
          check_config_boundary factory-prep.nerozon.de
          check_config_boundary github-prep.nerozon.de
