name: Deploy DEV2 WWW only
on:
  push:
    branches: [dev2]
    paths: ['www/**','.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: nerozon-dev2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy non-WWW runtime paths
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER_DEV2 }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD_DEV2 }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          for path in api deploy dispatcher factory github.nerozon.de; do
            lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; rm -r /$path; bye" || true
          done
      - name: Prepare WWW package
        run: |
          mkdir -p package-www
          cp -R www/. package-www/
          find package-www -type f \( -name 'RULES.md' -o -name '*-RULES.md' -o -name 'SPEC.md' -o -name '*-SPEC.md' \) -delete
      - name: Deploy WWW
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV2 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV2 }}
          local_path: './package-www/*'
          remote_path: '/www/'
          sftp_only: true
