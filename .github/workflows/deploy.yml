name: Deploy DEV3

on:
  push:
    branches:
      - dev3
    paths:
      - 'www/**'
      - 'api/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: nerozon-dev3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment controller
        run: |
          mkdir -p controller
          cp -R deploy/. controller/
          find controller -type d -exec chmod 755 {} \;
          find controller -type f -exec chmod 644 {} \;

      - name: Deploy controller
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV3 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV3 }}
          local_path: './controller/*'
          remote_path: '/deploy/'
          sftp_only: true

      - name: Create WWW deployment token
        id: token_www
        run: |
          TIMESTAMP=$(date +%s%3N)
          RANDOM_TOKEN=$(openssl rand -hex 16)
          TOKEN="dpl-${TIMESTAMP}-${RANDOM_TOKEN}"
          mkdir -p trigger-www
          touch "trigger-www/${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Upload WWW deployment token
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV3 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV3 }}
          local_path: './trigger-www/*'
          remote_path: '/'
          sftp_only: true

      - name: Prepare WWW staging
        run: |
          curl --fail --silent --show-error --max-time 30 --request POST \
            "https://deploy-dev3.nerozon.de/index.php?action=prepare&component=www&token=${{ steps.token_www.outputs.token }}"

      - name: Prepare WWW package
        run: |
          mkdir -p package-www
          cp -R www/. package-www/
          find package-www -type f \( -name 'RULES.md' -o -name '*-RULES.md' \) -delete
          find package-www -type d -exec chmod 755 {} \;
          find package-www -type f -exec chmod 644 {} \;

      - name: Upload WWW staging
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV3 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV3 }}
          local_path: './package-www/*'
          remote_path: '/www-deploy/'
          sftp_only: true

      - name: Activate WWW
        run: |
          curl --fail --silent --show-error --max-time 30 --request POST \
            "https://deploy-dev3.nerozon.de/index.php?action=deploy&component=www&token=${{ steps.token_www.outputs.token }}"

      - name: Smoke test WWW
        run: |
          curl --fail --silent --show-error --max-time 15 \
            "https://dev3.nerozon.de/" > /dev/null

      - name: Check API content
        id: check_api
        run: |
          if find api -type f -print -quit | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create API deployment token
        if: steps.check_api.outputs.deploy == 'true'
        id: token_api
        run: |
          TIMESTAMP=$(date +%s%3N)
          RANDOM_TOKEN=$(openssl rand -hex 16)
          TOKEN="dpl-${TIMESTAMP}-${RANDOM_TOKEN}"
          mkdir -p trigger-api
          touch "trigger-api/${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Upload API deployment token
        if: steps.check_api.outputs.deploy == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV3 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV3 }}
          local_path: './trigger-api/*'
          remote_path: '/'
          sftp_only: true

      - name: Prepare API staging
        if: steps.check_api.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --max-time 30 --request POST \
            "https://deploy-dev3.nerozon.de/index.php?action=prepare&component=api&token=${{ steps.token_api.outputs.token }}"

      - name: Prepare API package
        if: steps.check_api.outputs.deploy == 'true'
        run: |
          mkdir -p package-api
          cp -R api/. package-api/
          find package-api -type f \( -name 'RULES.md' -o -name '*-RULES.md' \) -delete
          find package-api -type d -exec chmod 755 {} \;
          find package-api -type f -exec chmod 644 {} \;

      - name: Upload API staging
        if: steps.check_api.outputs.deploy == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER_DEV3 }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD_DEV3 }}
          local_path: './package-api/*'
          remote_path: '/api-deploy/'
          sftp_only: true

      - name: Activate API
        if: steps.check_api.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --max-time 30 --request POST \
            "https://deploy-dev3.nerozon.de/index.php?action=deploy&component=api&token=${{ steps.token_api.outputs.token }}"
