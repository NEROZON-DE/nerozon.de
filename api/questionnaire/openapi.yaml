openapi: 3.0.3
info:
  title: NEROZON Questionnaire API
  version: 0.1.0
  description: Draft contract for anonymous questionnaire submission.
servers:
  - url: /api
paths:
  /v1/questionnaire/submissions:
    post:
      operationId: submitQuestionnaire
      summary: Submit an anonymous questionnaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuestionnaireRequest'
      responses:
        '201':
          description: Questionnaire accepted and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitQuestionnaireResponse'
        '400':
          description: Structurally or semantically invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal processing failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SubmitQuestionnaireRequest:
      type: object
      additionalProperties: false
      required:
        - questionnaire_id
        - questionnaire_version
        - answers
      properties:
        questionnaire_id:
          type: string
          enum: [S092026]
        questionnaire_version:
          type: string
          enum: ['20260830']
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireAnswer'
    QuestionnaireAnswer:
      type: object
      additionalProperties: false
      required: [question_id, type, value]
      properties:
        question_id:
          type: string
          pattern: '^S092026Q(0[1-9]|1[0-9]|20)$'
          example: S092026Q02
        type:
          type: string
          enum: [single_choice, multi_choice, scale, short_text]
        value:
          description: Type-specific value validated against the versioned questionnaire model. Choice values use IDs such as S092026Q02A03.
    SubmitQuestionnaireResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
